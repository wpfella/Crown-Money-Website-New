    <!-- Disable HubSpot Chatbot Widget (On the Right) -->
    <script>
      window.hsConversationsSettings = {
        loadImmediately: false
      };
      window.hsConversationsOnReady = [
        function() {
          if (window.HubSpotConversations && window.HubSpotConversations.widget) {
            window.HubSpotConversations.widget.remove();
          }
        }
      ];
      (function() {
        var removeHubSpotChat = function() {
          if (window.HubSpotConversations && window.HubSpotConversations.widget) {
            try { window.HubSpotConversations.widget.remove(); } catch(e) {}
          }
          var ids = ['hubspot-messages-iframe-container', 'hs-chat-open'];
          ids.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.remove();
          });
          var iframes = document.querySelectorAll('iframe[src*="hubspot.com/conversations-visitor"], iframe#hubspot-conversations-iframe');
          iframes.forEach(function(f) {
            if (f.parentElement) f.parentElement.remove();
          });
        };
        if (typeof window !== 'undefined') {
          window.addEventListener('DOMContentLoaded', function() {
            removeHubSpotChat();
            if (document.body) {
              var observer = new MutationObserver(removeHubSpotChat);
              observer.observe(document.body, { childList: true, subtree: true });
            }
          });
          window.addEventListener('load', removeHubSpotChat);
        }
      })();
    </script>
